<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Olimpiada Testi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 120px;
            text-align: center;
        }

        .timer.warning {
            background: #e74c3c;
        }

        .content {
            padding: 50px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .question-container {
            margin-bottom: 50px;
            padding: 25px;
            border-left: 5px solid #2c3e50;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .question-number {
            color: #2c3e50;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            padding: 16px 18px;
            border: 2px solid #d0d0d0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .option:hover {
            border-color: #2c3e50;
            background: #f0f5f9;
        }

        .option input[type="radio"] {
            margin-right: 14px;
            margin-top: 2px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #2c3e50;
            flex-shrink: 0;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            user-select: none;
            color: #333;
            font-size: 15px;
            line-height: 1.6;
        }

        .option.selected {
            border-color: #2c3e50;
            background: #e8f4f8;
        }

        .option.selected label {
            color: #2c3e50;
            font-weight: 600;
        }

        .footer {
            padding: 30px 50px;
            background: #f9f9f9;
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            border-top: 1px solid #e0e0e0;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(44, 62, 80, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-reset:hover {
            background: #d5dbdd;
        }

        .results {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .results.show {
            display: block;
        }

        .score-display {
            font-size: 56px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .score-display.high {
            color: #27ae60;
        }

        .score-display.low {
            color: #e74c3c;
        }

        .results-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .results-info {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            border-left: 5px solid #2c3e50;
            text-align: left;
            display: inline-block;
        }

        .results-info p {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .answered-counter {
            font-size: 14px;
            color: #666;
            margin-top: 25px;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 25px;
            }

            .question-container {
                margin-bottom: 35px;
                padding: 18px;
            }

            .footer {
                flex-direction: column;
                padding: 20px 25px;
            }

            .results {
                padding: 30px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Informatika Olimpiada Testi</h1>
            <div class="timer" id="timer">25:00</div>
        </div>

        <div class="content" id="content">
            <div id="questions-container"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="answered-counter" id="answered-counter">Javoblar: 0/40</div>
        </div>

        <div class="results" id="results">
            <h2 style="margin-bottom: 20px;">Test Natijalari</h2>
            <div class="score-display" id="score-display">0%</div>
            <div class="results-text" id="results-message"></div>
            <div class="results-info">
                <p id="results-details"></p>
            </div>
        </div>

        <div class="footer">
            <button class="btn-reset" onclick="resetQuiz()" id="reset-btn">Qayta boshlash</button>
            <button class="btn-submit" onclick="submitQuiz()" id="submit-btn">Testni tugatish</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Axborotlar qandayshakllardauzatilishimumkin?",
                options: ["Matnli, raqamli.", "Ovozli, grafik.", "Barcha javobto'g'ri."],
                correct: 2
            },
            {
                question: "Ma'lumotlarturibu - ……… .",
                options: ["O'zgaruvchiyokidoimiyqiymatlardagima'lumotlarshakli.", "Kompyuterdaberilganma'lumotar.", "Dasturlashtilihaqidaberiladiganma'lumotlar."],
                correct: 0
            },
            {
                question: "O'zgaruvchiqabulqilganqiymatturiniqaysifunksiyayordamidaaniqlashmumkin?",
                options: ["input().", "type().", "str()."],
                correct: 1
            },
            {
                question: "\" //\" ushbuarifmetikamalnomi?",
                options: ["Bo'lish.", "Bo'linmaningqoldig'inihisoblash.", "Bo'linmaningbutunqiymatinihisoblash."],
                correct: 2
            },
            {
                question: "Satr nima?",
                options: ["So'zlarketma-ketligi.", "Harf, son vabelgilarhamdaprobeldantarkibtopganbelgilarketma-ketligi.", "To'g'rijavobyo'q."],
                correct: 1
            },
            {
                question: "Satr uzunliginiqaysifunksiyayordamidaaniqlashmumkin?",
                options: ["len().", "Print().", "input()."],
                correct: 0
            },
            {
                question: "Satrlarnibirlashtirishuchunqaysiamalqo'llaniladi?",
                options: ["+", "-", "/"],
                correct: 0
            },
            {
                question: "Pythondasatrdagibelgilarniraqamlashnechchidanboshlanadi?",
                options: ["1 dan.", "0 dan.", "2 dan."],
                correct: 1
            },
            {
                question: "Print() qandayvazifabajaradi?",
                options: ["Satr uzunliginianiqlaydi.", "Satrlarnibirlashtiradi.", "Ma'lumotlarniekrangachiqarishfaylgayozishvasifasinibajaradi."],
                correct: 2
            },
            {
                question: "End vasep print nimauchunqo'llaniladi?",
                options: ["Ma'lumotlarnichiqarishparametrlarinio'zgartirishuchun.", "Python dasturigama'lumotlarniyozishuchun.", "To'g'rijavobyo'q."],
                correct: 0
            },
            {
                question: "Dasturlashjarayonidaasosannechaxilalgoritmdanfoydalaniladi?",
                options: ["2 xil.", "3 xil.", "5 xil."],
                correct: 1
            },
            {
                question: "Buyruqlarning qat'iyketma-ketlikdatartibbilanbajarilishinima deb ataladi?",
                options: ["Algoritm.", "Dasturlashjarayoni.", "Chizqlialgoritm."],
                correct: 0
            },
            {
                question: "Chiziqlialgoritmlarnidasturshaklidayozilishiga ………… deyiladi.",
                options: ["Chiziqlidastur.", "Chizqlialgoritm.", "To'g'rijavobyo'q."],
                correct: 0
            },
            {
                question: "Amallarningqat'iyketma-ketlikdabajarilishinima deb ataladi?",
                options: ["Chiziqlidastur.", "Chiziqliijro.", "Chiziqlialgoritm."],
                correct: 1
            },
            {
                question: "O'zgaruvchilarnitaqqoslashuchunqandayamallardanfoydalaniladi?",
                options: ["Soddaamallardan.", "Mantiqiyamallardan.", "To'g'rijavobyo'q."],
                correct: 1
            },
            {
                question: "Taqqoslashamallarigaqaysiamallarkiradi?",
                options: ["<,>,=,!=.", "<,=,+,-.", ">,+,=."],
                correct: 0
            },
            {
                question: "Birorta shartgako'rabuyruqlarketma-ketliginingbajarilishiyokibajarilmasliginibelgilovchialgoritmnima deb ataladi?",
                options: ["Dasturlashalgoritimi.", "Tekshiruvchialgoritm.", "Tarmoqlanuvchialgoritm."],
                correct: 2
            },
            {
                question: "If operatoritarkibidagishart True quymatqaytarsa, buyruqlar bloke bajariladimi?",
                options: ["yo'q.", "Ha.", "Bajarilmaydi."],
                correct: 1
            },
            {
                question: "Buyruqlar_bloki if operatoridan keying satrdaxatboshidannechtaprobelqoldiribkeyinyoziladi?",
                options: ["4 ta.", "8 ta.", "probelqoldirmayyoziladi."],
                correct: 0
            },
            {
                question: "Shartnitekshirishuchunqaysioperatordanfoydalaniladi?",
                options: ["Print().", "if.", "To'g'rijavobyo'q."],
                correct: 1
            },
            {
                question: "Shartdankelibchiqib, harbirshartgamosbuyruqlarketma-ketliginibajaradiganifningtakomillashganko'rinishi……..?",
                options: ["Elif operatori.", "If operatori.", "CASE operatori."],
                correct: 0
            },
            {
                question: "Elif-else va if so'zlariningkombinatsiyasibo'lib, qandayma'nonianglatadi?",
                options: ["\"Aks holda agar\".", "\"Rost  vayolg'on\".", "To'g'rijavobyo'q."],
                correct: 0
            },
            {
                question: "Dastur tuzishjarayonidamurakkabshartliifodalarniyozishuchunnimalardanfoydalaniladi?",
                options: ["operatorlardan.", "Mantiqiyamallardan.", "Barcha javobto'g'ri."],
                correct: 2
            },
            {
                question: "\"==\" belginingnomi?",
                options: ["Teng emas.", "Kata yokiteng.", "Aynan teng."],
                correct: 2
            },
            {
                question: "\"/t  belginingnominima?",
                options: ["Tabulyatsiyabelgisi.", "Yangi satrgao'tishbelgisi.", "bittalikqo'shtirnoqbelgisi."],
                correct: 0
            },
            {
                question: "Chiziqli tuzilishgaegabo'lganalgoritmningblok-sxemasiasosannimalaryordamidatuziladi?",
                options: ["Algoritmniboshlash, tugatishboki.", "Kiritish/chiqarishbloki, funksional bloke.", "Barcha javobto'g'ri."],
                correct: 2
            },
            {
                question: "…………. Bir chiziqbo'ylabjoylashgan, ketma-ketbajariladiganko'rsatmalarto'plamiko'rinishidabo'ladi.",
                options: ["Chizqlialgoritm.", "Chiziqlituzilish.", "To'g'rijavobyo'q."],
                correct: 0
            },
            {
                question: "Hozirgi kundaqandaydasturlashtillarikechtarqalgan?",
                options: ["Pascal, Delphi, C, C++.", "Java, Python.", "Barcha javobto'g'ri."],
                correct: 2
            },
            {
                question: "Tarmoqlanuvchistrukturaodatdaqandaydirmantiqiyshartni ………… o'zichigaoladi?",
                options: ["Tekshirishblokini.", "Tarmoqlanuvchituzilish.", "To'g'rijavobyo'q."],
                correct: 0
            },
            {
                question: "Birorbirsharttekshirilishiyokiqandaydirparametrningharxilqiymatlariasosidaalgoritmdatakrorlanishiyuzberadiganjarayonlarga …………. .",
                options: ["Tarmoqanuvchialgoritm.", "Takrorlanuvchialgoritm.", "Tekshiriluvchialgoritm."],
                correct: 1
            },
            {
                question: "Hisoblash jarayoniningko'pmartatakrorlanadiganqisminima deb yuritiladi?",
                options: ["SUMM.", "PRODUCT.", "Ichkisikltanasi."],
                correct: 2
            },
            {
                question: "Tarkibida birnechaturdagialgoritmlarqatnashganalgoriymga …………..deyiladi.",
                options: ["Aralashalgoritm.", "Tarmoqlanuvchinalgoritm.", "Tekshiruvchialgoritm."],
                correct: 0
            },
            {
                question: "Kompyuter uchundasturtuzisharayoninimadeyiladi?",
                options: ["Kompyuter dasturi.", "Dasturlash.", "Dasturchi."],
                correct: 1
            },
            {
                question: "Kompyuterda birormasalanihalqilishuchunengavvalonimaqilinadi?",
                options: ["Kompyutergayoziladi.", "Dastur tuziladi.", "Modelivaalgoritmituziladi."],
                correct: 2
            },
            {
                question: "Yaratilganmatnkompyutertilidanima deb ataladi?",
                options: ["Yozilgandastur.", "Tuzilgandastur.", "Algoritm."],
                correct: 0
            },
            {
                question: "Dastur tuzuvchishaxsnima deb yuritiladi?",
                options: ["Dasturchi.", "Foydalanuvchi.", "To'g'rijavobyo'q."],
                correct: 0
            },
            {
                question: "Kir yuvishmashinasi ham dasturlashasosidaishlaydimi?",
                options: ["Yo'q.", "Ha.", "To'g'rijavobyo'q."],
                correct: 1
            },
            {
                question: "Kompyuter tushunadiganvamuloqatolibboradigan \"til\" ……… deb ataladi.",
                options: ["Dastur.", "Dasturlashtili.", "Dasturlashalgoritmi."],
                correct: 1
            },
            {
                question: "Translyatr nima?",
                options: ["Dastur turi.", "Dasturchinomi.", "Tarjimontili."],
                correct: 2
            },
            {
                question: "IDE so'ziningto'liqnomi?",
                options: ["Integrated Development Environment.", "Integrated Development.", "To'g'rijavobyo'q."],
                correct: 0
            }
        ];

        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 25 * 60;
        let timerInterval;
        let quizSubmitted = false;
        let shuffledQuestions = [];
        let questionIndices = [];

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initQuiz() {
            questionIndices = Array.from({ length: questions.length }, (_, i) => i);
            questionIndices = shuffleArray(questionIndices);
            shuffledQuestions = questionIndices.map(i => ({ ...questions[i], originalIndex: i }));
            userAnswers = new Array(questions.length).fill(null);
            renderQuestions();
            startTimer();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            shuffledQuestions.forEach((q, displayIndex) => {
                const index = q.originalIndex;
                const div = document.createElement('div');
                div.className = 'question-container';
                div.innerHTML = `
                    <div class="question-number">Savol ${displayIndex + 1}/40</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options" id="options-${index}">
                        ${q.options.map((option, optIndex) => `
                            <label class="option" id="option-${index}-${optIndex}">
                                <input type="radio" name="question-${index}" value="${optIndex}" 
                                    onchange="selectAnswer(${index}, ${optIndex})" 
                                    ${userAnswers[index] === optIndex ? 'checked' : ''}>
                                <span>${String.fromCharCode(65 + optIndex)}) ${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });

            updateProgress();
        }

        function selectAnswer(questionIndex, optionIndex) {
            userAnswers[questionIndex] = optionIndex;
            updateProgress();

            const optionLabel = document.getElementById(`option-${questionIndex}-${optionIndex}`);
            const allOptions = document.querySelectorAll(`[id^="option-${questionIndex}-"]`);
            allOptions.forEach(opt => opt.classList.remove('selected'));
            optionLabel.classList.add('selected');
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null).length;
            const percentage = (answered / questions.length) * 100;

            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('answered-counter').textContent = `Javoblar: ${answered}/40`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;

                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                const timerDisplay = document.getElementById('timer');

                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 300) {
                    timerDisplay.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function submitQuiz() {
            if (quizSubmitted) return;
            quizSubmitted = true;

            clearInterval(timerInterval);

            const correct = userAnswers.filter((answer, index) => answer !== null && answer === questions[index].correct).length;
            const percentage = Math.round((correct / questions.length) * 100);

            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('high');
            } else if (percentage < 50) {
                scoreDisplay.classList.add('low');
            }

            const messagesMap = {
                100: "Ajoyib! Siz barcha savollarga to'g'ri javob berdingiz!",
                90: "Juda yaxshi natija! Siz 90% dan ortiq o'zingiz bilan!",
                80: "Yaxshi! Siz 80% yuqori natija oldinggiz.",
                70: "O'rta darajali natija. O'z bilimingizni ko'paytiring.",
                50: "Natija o'rta. Ko'proq o'zini tekshiring.",
                0: "Iloji bor qayta ko'paytirish. Bilimni o'rganing va qayta urinib ko'ring."
            };

            const message = Object.keys(messagesMap)
                .sort((a, b) => b - a)
                .find(score => percentage >= parseInt(score));

            document.getElementById('results-message').textContent = messagesMap[message];
            document.getElementById('results-details').innerHTML = `
                <strong>To'g'ri javoblar:</strong> ${correct}/${questions.length}<br>
                <strong>Noto'g'ri javoblar:</strong> ${questions.length - correct}/${questions.length}<br>
                <strong>Javob bermaganlar:</strong> ${userAnswers.filter(a => a === null).length}/${questions.length}
            `;

            document.getElementById('questions-container').style.display = 'none';
            document.getElementById('results').classList.add('show');
            document.getElementById('submit-btn').style.display = 'none';
        }

        function resetQuiz() {
            userAnswers = new Array(questions.length).fill(null);
            quizSubmitted = false;
            timeLeft = 25 * 60;

            document.getElementById('questions-container').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('timer').classList.remove('warning');

            renderQuestions();
            startTimer();
        }

        window.addEventListener('load', initQuiz);
    </script>
</body>
</html>
