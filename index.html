planation":"32 = 2⁵, har belgi 5 bit. 1600·5 = 8000 bit. 8000/8 = 1000 bayt.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v2q23","stage":2,"number":23,"topic":"Tarmoqlar","prompt":"1.5 MiB fayl 512 KiB/s tezlikda uzatiladi. Kechikishsiz uzatish vaqtini soniyada toping.","options":["3","24","2","6"],"answer":0,"explanation":"1.5 MiB = 1.5·1024 = 1536 KiB. Vaqt = 1536/512 = 3 s. Tezlik bu safar bayt/s da berilgan.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v2q24","stage":2,"number":24,"topic":"Mantiq","prompt":"A XOR B XOR C ifodasining uch o‘zgaruvchili rostlik jadvalida nechta rost natija bor?","options":["6","3","2","4"],"answer":3,"explanation":"XOR 1 lar soni toq bo‘lsa rost: bitta 1 bo‘lgan uchta satr va uchta 1 bo‘lgan bitta satr. Jami 4 ta.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v2q25","stage":2,"number":25,"topic":"Excel","prompt":"A1:A5 da 3, \"matn\", 0, bo‘sh katak va 7 mavjud. =COUNT(A1:A5) natijasi nechaga teng?","options":["4","2","5","3"],"answer":3,"explanation":"COUNT faqat sonli kataklarni sanaydi: 3, 0, 7 — uchta. Nol ham son. Matn va haqiqiy bo‘sh katak hisoblanmaydi.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v2q26","stage":2,"number":26,"topic":"Python","prompt":"Python 3 dasturi chiqishini toping.","options":["9","1234","10","4"],"answer":2,"explanation":"Har qadamda oxirgi raqam qo‘shiladi va olib tashlanadi: 4, 3, 2, 1. Yig‘indi 4+3+2+1 = 10.","code":"n = 1234\ns = 0\nwhile n > 0:\n    s += n % 10\n    n //= 10\nprint(s)","difficulty":"Murakkab","weight":26},{"id":"v2q27","stage":2,"number":27,"topic":"Python","prompt":"Python 3 dasturidan keyin a ro‘yxati qanday ko‘rinadi?","options":["[1, 2, [3]]","[1, 2]","[1, 2, 3]","[3, 1, 2]"],"answer":2,"explanation":"b = a ro‘yxat nusxasini yaratmaydi; ikkalasi bitta obyektga ishora qiladi. b.append(3) shu umumiy ro‘yxatni o‘zgartiradi.","code":"a = [1, 2]\nb = a\nb.append(3)\nprint(a)","difficulty":"Murakkab","weight":26},{"id":"v2q28","stage":2,"number":28,"topic":"Python","prompt":"Python 3 rekursiv kodining natijasi nechaga teng?","options":["16","31","32","15"],"answer":1,"explanation":"g(0)=1. Keyin g(1)=3, g(2)=7, g(3)=15, g(4)=31. Har safar avvalgi qiymat 2 ga ko‘payib, 1 qo‘shiladi.","code":"def g(n):\n    if n == 0:\n        return 1\n    return 2 * g(n - 1) + 1\n\nprint(g(4))","difficulty":"Murakkab","weight":26},{"id":"v2q29","stage":2,"number":29,"topic":"Axborot hajmi","prompt":"128 × 64 pikselli rasmning har pikseli 32 bitda saqlanadi. Siqish va sarlavhasiz hajmi necha KiB?","options":["256","32","16","8"],"answer":1,"explanation":"128·64 = 8192 piksel; 32 bit = 4 bayt. 8192·4 = 32768 bayt = 32 KiB.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v2q30","stage":2,"number":30,"topic":"Mantiq","prompt":"(A OR B) AND (C XOR D) ifodasi to‘rt o‘zgaruvchili jadvalning nechta satrida rost?","options":["4","12","8","6"],"answer":3,"explanation":"A OR B uchun 3 ta rost juftlik bor. C XOR D uchun (0,1) va (1,0) — 2 ta. Juftliklar mustaqil, jami 3·2 = 6.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v3q01","stage":3,"number":1,"topic":"Qurilmalar","prompt":"Qaysi qurilma ma’lumotni elektr o‘chirilgandan keyin ham saqlash uchun ishlatiladi?","options":["Protsessor keshi","SSD","RAM","Protsessor registri"],"answer":1,"explanation":"SSD doimiy, energiyaga bog‘liq bo‘lmagan saqlash qurilmasi. RAM, odatiy CPU registrlari va keshi joriy hisoblar uchun ishlatiladigan energiyaga bog‘liq xotiradir.","code":null,"difficulty":"Oson","weight":9},{"id":"v3q02","stage":3,"number":2,"topic":"Dasturiy ta’minot","prompt":"Bir nechta faylni arxivga birlashtirish uchun odatda qaysi kengaytma ishlatiladi?","options":[".py",".bmp",".zip",".mp3"],"answer":2,"explanation":".zip arxiv formatidir. .mp3 audio, .bmp rasm, .py Python kodi uchun ishlatiladi.","code":null,"difficulty":"Oson","weight":9},{"id":"v3q03","stage":3,"number":3,"topic":"Tarmoqlar","prompt":"Turli IP tarmoqlar o‘rtasida paketlarni yo‘n 4 bit. 320·4=1280 bit. 1280/160=8 soniya. Bu yerda tezlik bit/s da.","code":null,"difficulty":"Murakkab","weight":26},{"id":"v5q30","stage":5,"number":30,"topic":"Python","prompt":"Quyidagi dastur chiqishi 250 dan qat’iy katta bo‘lishi uchun kiritiladigan eng kichik natural n ni toping.","options":["6","5","7","8"],"answer":2,"explanation":"0 dan 2ⁿ−1 gacha har bir bit xonasi sonlarning yarmida 1 bo‘ladi. Jami 1 lar n·2ⁿ⁻¹. n=6 da 192; n=7 da 448. 192≤250\u003c448, demak minimal n=7.","code":"def total(n):\n    s = 0\n    for i in range(1 \u003c\u003c n):\n        s += bin(i).count(\"1\")\n    return s\n\nprint(total(int(input())))","difficulty":"Murakkab","weight":26}]</script>
<script>

function icon(name){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.info}</svg>`;}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(value){return Number.isInteger(value)?String(value):Number(value).toFixed(1);}
function questions(stage){return BANK.filter(q=>q.stage===stage);}
function scoreAnswers(stage,answers){const qs=questions(stage);let earned=0,correct=0,answered=0;qs.forEach((q,i)=>{if(answers[i]!==null&&answers[i]!==undefined)answered++;if(answers[i]===q.answer){correct++;earned+=q.weight;}});return {earned,correct,answered,wrong:answered-correct,blank:30-answered,score:earned/5,olympic:earned/10};}
function unlocked(stage){return stage===1||state.passed.slice(0,stage-1).every(Boolean);}
function freshState(){return {version:1,name:'',theme:'dark',passed:Array(5).fill(false),best:Array(5).fill(0),history:[],active:null};}
function validOrder(order){return Array.isArray(order)&&order.length===30&&order.every(row=>Array.isArray(row)&&row.length===4&&[...row].sort().join(',')==='0,1,2,3');}
function validAnswers(answers){return Array.isArray(answers)&&answers.length===30&&answers.every(x=>x===null||(Number.isInteger(x)&&x>=0&&x<=3));}
function normalize(raw){
  if(!raw||raw.version!==1)throw new Error('Format mos emas');
  const clean=freshState();clean.name=typeof raw.name==='string'?raw.name.slice(0,50):'';clean.theme=raw.theme==='light'?'light':'dark';
  if(Array.isArray(raw.history))clean.history=raw.history.filter(r=>r&&Number.isInteger(r.stage)&&r.stage>=1&&r.stage<=5&&validAnswers(r.answers)&&validOrder(r.order)&&Number.isFinite(r.started)&&Number.isFinite(r.ended)&&typeof r.id==='string').slice(0,60).map(r=>({...r,...scoreAnswers(r.stage,r.answers)}));
  // Mastery is backed by a full 30-answer record, including after history is trimmed.
  if(Array.isArray(raw.masters))clean.masters=Array.from({length:5},(_,i)=>{const r=raw.masters[i];return r&&r.stage===i+1&&validAnswers(r.answers)&&scoreAnswers(i+1,r.answers).correct===30?r:null;});
  else clean.masters=Array(5).fill(null);
  clean.history.forEach(r=>{clean.best[r.stage-1]=Math.max(clean.best[r.stage-1],r.score);if(r.correct===30&&!clean.masters[r.stage-1])clean.masters[r.stage-1]={stage:r.stage,answers:r.answers.slice()};});
  for(let i=0;i<5;i++){clean.passed[i]=!!clean.masters[i]&&(i===0||clean.passed[i-1]);if(clean.passed[i])clean.best[i]=100;}
  if(Array.isArray(raw.best))for(let i=0;i<5;i++)if(Number.isFinite(raw.best[i])&&raw.best[i]>=0&&raw.best[i]<100)clean.best[i]=Math.max(clean.best[i],raw.best[i]);
  const a=raw.active;
  if(a&&Number.isInteger(a.stage)&&a.stage>=1&&a.stage<=5&&(a.stage===1||clean.passed.slice(0,a.stage-1).every(Boolean))&&validAnswers(a.answers)&&validOrder(a.order)&&Number.isFinite(a.started)&&a.deadline===a.started+DURATION&&a.started<=Date.now()+1000){
    clean.active={...a,index:Math.max(0,Math.min(29,Number.isInteger(a.index)?a.index:0)),flags:Array.from({length:30},(_,i)=>!!a.flags?.[i])};
  }
  return clean;
}
let storageOK=true;
let state;
try{const saved=localStorage.getItem(STORE_KEY);state=saved?normalize(JSON.parse(saved)):freshState();}catch(e){state=freshState();storageOK=false;}
if(!state.masters)state.masters=Array(5).fill(null);
let view='home',resultRecord=null,resultFilter='wrong',practice=null,modalAction=null,toastTimer=null;
const app=document.getElementById('app');
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
function toast(message){clearTimeout(toastTimer);const box=document.getElementById('toast');box.textContent=message;box.hidden=false;toastTimer=setTimeout(()=>{box.hidden=true;},4200);}
function clockText(ms){const seconds=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
function dateText(timestamp){return new Date(timestamp).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function shuffle(){const values=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]];}return values;}
function modal(title,message,callback,label='Davom etish'){
  const box=document.getElementById('modal');modalAction=callback;
  box.innerHTML=`<h2 id="modal-title">${esc(title)}</h2><p>${esc(message)}</p><div class="dialog-actions"><button class="btn secondary" data-action="cancel-modal">Ortga</button><button class="btn primary" data-action="confirm-modal">${esc(label)}</button></div>`;
  box.showModal();
}
function header(){document.getElementById('header').innerHTML=`<div class="brand" role="button" tabindex="0" data-action="go-home" aria-label="Variantlar sahifasi"><span class="brand-mark">${icon('code')}</span><div><div class="brand-title">OLIMPIADA <span style="color:var(--accent)">150</span></div><div class="brand-sub">INFORMATIKA · 10-SINF</div></div></div><nav class="header-nav" aria-label="Asosiy menyu"><button class="navbtn ${view==='home'||view==='exam'?'active':''}" data-action="go-home">Variantlar</button><button class="navbtn ${view==='history'?'active':''}" data-action="go-history">Natijalarim</button><button class="navbtn ${view==='rules'?'active':''}" data-action="go-rules">Qoida va manbalar</button></nav><div class="row"><span class="header-tag">Internetsiz ishlaydi</span><button class="iconbtn" data-action="theme" aria-label="${state.theme==='dark'?'Yorug‘ rejimga o‘tish':'Qorong‘i rejimga o‘tish'}" title="${state.theme==='dark'?'Yorug‘ rejim':'Qorong‘i rejim'}">${icon(state.theme==='dark'?'sun':'moon')}</button></div>`;}
function render(){document.documentElement.dataset.theme=state.theme;header();if(view==='home')renderHome();else if(view==='exam')renderExam();else if(view==='result')renderResult();else if(view==='history')renderHistory();else if(view==='rules')renderRules();else if(view==='practice')renderPractice();}
function go(target){if(state.active&&view==='exam'&&target!=='exam')toast('Javoblar saqlandi. Test taymeri davom etadi.');view=target;render();window.scrollTo({top:0,behavior:'instant'});}
function begin(stage){clearTimeout(toastTimer);document.getElementById('toast').hidden=true;state.active={stage,started:Date.now(),deadline:Date.now()+DURATION,index:0,answers:Array(30).fill(null),flags:Array(30).fill(false),order:Array.from({length:30},shuffle)};state.active.deadline=state.active.started+DURATION;save();view='exam';render();window.scrollTo({top:0,behavior:'instant'});}
function requestStart(stage,restart=false){
  if(!unlocked(stage)){toast(`Avval ${stage-1}-variantdan 100/100 oling.`);return;}
  if(state.active){if(state.active.stage===stage&&!restart){view='exam';render();checkExpiry();window.scrollTo({top:0,behavior:'instant'});return;}
    modal('Yangi urinishni boshlash',`${state.active.stage}-variantdagi tugallanmagan urinish almashtiriladi. Oldingi yakunlangan natijalar saqlanadi.`,()=>begin(stage),'Boshlash');return;}

}
function checkExpiry(){if(state.active&&Date.now()>=state.active.deadline){finish(true);return true;}return false;}
function finish(auto=false){
  const a=state.active;if(!a)return;
  const score=scoreAnswers(a.stage,a.answers);
  const record={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),stage:a.stage,started:a.started,ended:Math.min(Date.now(),a.deadline),answers:a.answers.slice(),order:a.order.map(x=>x.slice()),timedOut:auto,...score};
  state.best[a.stage-1]=Math.max(state.best[a.stage-1],score.score);
  if(score.correct===30){state.passed[a.stage-1]=true;state.masters[a.stage-1]={stage:a.stage,answers:a.answers.slice()};}
  state.history.unshift(record);state.history=state.history.slice(0,60);state.active=null;save();
  resultRecord=record;resultFilter=score.correct===30?'all':'wrong';view='result';document.getElementById('modal').close();render();window.scrollTo({top:0,behavior:'instant'});
  if(score.correct===30)celebrate();if(auto)toast('90 daqiqa tugadi. Natija avtomatik hisoblandi.');
}
function finishRequest(){if(checkExpiry())return;const a=state.active;if(!a)return;const answered=a.answers.filter(x=>x!==null).length;modal('Testni yakunlaysizmi?',`${answered}/30 savolga javob belgilangan.${answered<30?' Belgilanmagan '+(30-answered)+' ta savol uchun ball berilmaydi.':''} Yakunda natija va barcha yechim izohlarini ko‘rasiz.`,()=>finish(false),'Yakunlash');}

}

function renderRules(){app.innerHTML=`<div class="content-page"><div class="page-head"><div class="eyebrow" style="margin-bottom:9px">Boshlashdan oldin</div><h1>Qoida va manbalar</h1><p>Bu 10-sinf informatika olimpiadasiga tayyorlanish uchun mustaqil mashq dasturi.</p></div><div class="rules-grid"><section class="panel"><h3>${icon('clock')} Test tartibi</h3><ol class="rules-list"><li>Jami 150 ta noyob savol: 5 ta variant, har birida 30 ta aralash savol.</li><li>Har bir variant uchun 90 daqiqa. Savollarni istalgan tartibda tanlash va javobni almashtirish mumkin.</li><li>Har savolda 4 ta variantdan faqat bitta to‘g‘ri javob bor. Javoblar yakunda tekshiriladi.</li><li>«Keyinga belgilash» savolni unutmaslik uchun. Bu javob berish o‘rniga o‘tmaydi.</li><li>Vaqt tugaganda test mavjud javoblar bilan avtomatik yakunlanadi. Sahifadan chiqishda ham taymer davom etadi.</li></ol></section><section class="panel"><h3>${icon('lock')} Bosqichlar ochilishi</h3><ol class="rules-list"><li>Dastlab faqat 1-variant ochiq.</li><li>To‘liq variantda 30/30 ta to‘g‘ri javob, ya’ni 100/100 olsangiz, keyingisi ochiladi.</li><li>Ochilgan variantni tanlab qayta ishlash mumkin. Keyingi yomonroq urinish uni yopmaydi.</li><li>Yakuniy tahlilda siz tanlagan javob, to‘g‘ri javob va yechim izohi bor.</li><li>«Xatolarni qayta yechish» mashq rejimidir. U keyingi bosqichni ochmaydi; buning uchun to‘liq variantni mukammal yakunlang.</li></ol></section></div><section class="panel"><h3>Olimpiada uslubidagi baholash</h3><p>2025-yilgi namunadagi 50 ballik tuzilma mashq uchun 100 ballga o‘tkazilgan. Ballar qiyinlikka qarab farq qiladi.</p><table class="data-table"><thead><tr><th>SAVOLLAR</th><th>HAR BIRI</th><th>JAMI / 50</th><th>JAMI / 100</th></tr></thead><tbody><tr><td>1–10 · Oson</td><td>0.9</td><td>9</td><td>18</td></tr><tr><td>11–20 · O‘rta</td><td>1.5</td><td>15</td><td>30</td></tr><tr><td>21–30 · Murakkab</td><td>2.6</td><td>26</td><td>52</td></tr><tr><td><strong>Jami 30 savol</strong></td><td>—</td><td><strong>50</strong></td><td><strong>100</strong></td></tr></tbody></table><p style="margin-top:14px">Noto‘g‘ri yoki belgilanmagan javob 0 ball. Yakuniy /100 ball — olimpiada ballining 2 baravari. 100/100 olish uchun barcha savollar to‘g‘ri bo‘lishi shart.</p></section><section class="panel"><h3>Savollardagi kelishuvlar</h3><p>Python savollari Python 3 uchun. Excel formulalari inglizcha nomlarda, vergul bilan yozilgan; mahalliy Excelingizda funksiya tarjimasi va ajratgich farq qilishi mumkin. Sanoq sistemasining asosi son yonidagi kichik indeksda ko‘rsatilgan. 1 bayt = 8 bit; 1 KiB = 1024 bayt; 1 MiB = 1024 KiB; 1 Kibit = 1024 bit; 1 Mibit = 1024² bit. Axborot hajmi savollarida siqish va xizmat ma’lumotlari hisobga olinishi alohida aytilgan.</p></section><section class="panel"><h3>Namunalar va tekshirish manbalari</h3><p>150 savol mustaqil tuzilgan, 2024–2025-yilgi tuman variantlarining mavzulari va savol uslubiga mos. Ular kelasi olimpiadada aynan tushadigan savollar sifatida taqdim etilmaydi.</p><ul class="source-list"><li><a href="https://darsuchun.uz/wp-content/uploads/2025/10/10-sinf-Informatika-2025-tuman-shahar-bosqichi-olimpiada.pdf" target="_blank" rel="noopener noreferrer">2025-yil: 10-sinf tuman bosqichi savollari va kalitlari (PDF)</a></li><li><a href="https://static.imtihonlar.uz/uploads/1/10-Informatika%202024%20uzb.pdf" target="_blank" rel="noopener noreferrer">2024-yil: 10-sinf tuman bosqichi topshiriqlari (PDF)</a></li><li><a href="https://docs.python.org/3/library/stdtypes.html" target="_blank" rel="noopener noreferrer">Python rasmiy qo‘llanmasi: turlar, satrlar va amallar</a></li><li><a href="https://support.microsoft.com/en-us/excel/switch-between-relative-absolute-and-mixed-references" target="_blank" rel="noopener noreferrer">Microsoft: nisbiy, mutlaq va aralash murojaatlar</a></li></ul><p style="margin-top:14px">Testni ishlash uchun internet kerak emas. Manba havolalarini ochish uchun internet kerak bo‘ladi.</p></section><button class="btn primary" data-action="go-home">Variantlarga qaytish ${icon('arrow')}</button></div>`;}

function startPractice(){
  if(!resultRecord)return;const qs=questions(resultRecord.stage);const indices=qs.map((q,i)=>resultRecord.answers[i]!==q.answer?i:null).filter(i=>i!==null);
  if(!indices.length){toast('Bu urinishda xato yo‘q.');return;}
  practice={stage:resultRecord.stage,indices,index:0,choice:null,order:shuffle(),checked:false,correct:0,done:false};view='practice';render();window.scrollTo({top:0,behavior:'instant'});
}
function renderPractice(){
  const p=practice;if(!p){view='result';render();return;}
  if(p.done){app.innerHTML=`<section class="panel practice-done">${icon('trophy')}<div class="eyebrow" style="margin-top:15px">XATO USTIDA ISHLASH</div><h1>Mashq yakunlandi.</h1><div class="mini-score" style="margin:20px 0">${p.correct}<span> / ${p.indices.length} to‘g‘ri</span></div><p>Keyingi bosqichni ochish uchun to‘liq 30 savolli variantdan 100/100 oling. Mashq javoblari asosiy test natijasini o‘zgartirmaydi.</p><div class="row wrap"><button class="btn primary" data-action="retry" data-stage="${p.stage}">To‘liq variantni ishlash ${icon('arrow')}</button><button class="btn secondary" data-action="back-result">Tahlilga qaytish</button></div></section>`;return;}
  const q=questions(p.stage)[p.indices[p.index]],right=p.choice===q.answer;
  app.innerHTML=`<div class="exam-top"><div class="exam-title"><button class="iconbtn" data-action="back-result" aria-label="Tahlilga qaytish">${icon('left')}</button><div><div class="eyebrow" style="margin-bottom:6px">XATOLARNI QAYTA YECHISH</div><h2>${p.stage}-variant · Mashq ${p.index+1}/${p.indices.length}</h2><p>Vaqt cheklanmagan · Bu mashq bosqichni ochmaydi</p></div></div><span class="tag blue">${p.correct} ta to‘g‘ri</span></div><div class="question-card" style="max-width:880px;margin:auto"><div class="question-meta"><div class="row wrap"><span class="tag blue">${esc(q.topic)}</span><span class="tag">Asl ${q.number}-savol</span></div><button class="btn ghost smallbtn" data-action="back-result">Tahlilga qaytish</button></div><h2 class="question-prompt">${esc(q.prompt)}</h2>${codeBlock(q)}<div class="options" role="group" aria-label="Mashq javoblari">${p.order.map((original,display)=>`<button class="option ${p.choice===original?'selected':''}" data-action="practice-answer" data-index="${display}" aria-pressed="${p.choice===original}" ${p.checked?'disabled':''}><span class="option-letter">${LETTERS[display]}</span><span class="option-text">${esc(q.options[original])}</span></button>`).join('')}</div>${p.checked?`<div class="practice-feedback"><span class="tag ${right?'green':'red'}">${right?'To‘g‘ri yechildi':'Yechimni yana bir bor ko‘ring'}</span><p style="margin-top:12px;font-size:14px"><strong>To‘g‘ri javob:</strong> ${esc(q.options[q.answer])}</p><div class="explanation"><strong>YECHIM VA TUSHUNTIRISH</strong>${esc(q.explanation)}</div><button class="btn primary" data-action="practice-next" style="margin-top:20px">${p.index===p.indices.length-1?'Mashqni yakunlash':'Keyingi xato savol'} ${icon('arrow')}</button></div>`:`<button class="btn primary" data-action="practice-check" style="margin-top:22px" ${p.choice===null?'disabled':''}>Javobni tekshirish ${icon('check')}</button>`}</div>`;
}
function practiceCheck(){if(!practice||practice.checked||practice.choice===null)return;const q=questions(practice.stage)[practice.indices[practice.index]];practice.checked=true;if(practice.choice===q.answer)practice.correct++;render();}
function practiceNext(){if(!practice?.checked)return;if(practice.index+1===practice.indices.length)practice.done=true;else{practice.index++;practice.choice=null;practice.checked=false;practice.order=shuffle();}render();window.scrollTo({top:0,behavior:'instant'});}
function downloadFile(filename,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadResult(){if(!resultRecord)return;const r=resultRecord,score=scoreAnswers(r.stage,r.answers);let text=`10-SINF INFORMATIKA — OLIMPIADA 150\nIshtirokchi: ${state.name||'Ishtirokchi'}\nVariant: ${r.stage}\nSana: ${dateText(r.ended)}\nNatija: ${fmt(score.score)}/100 (${fmt(score.olympic)}/50 olimpiada balli)\nTo‘g‘ri: ${score.correct}/30; xato: ${score.wrong}; belgilanmagan: ${score.blank}\n\n`;
  questions(r.stage).forEach((q,i)=>{text+=`${q.number}. ${q.prompt}\n${q.code?q.code+'\n':''}Sizning javobingiz: ${r.answers[i]===null?'Belgilanmagan':q.options[r.answers[i]]}\nTo‘g‘ri javob: ${q.options[q.answer]}\nIzoh: ${q.explanation}\n\n`;});
  downloadFile(`informatika-${r.stage}-variant-natija.txt`,text,'text/plain;charset=utf-8');
}
function exportState(){save();downloadFile('informatika-150-natijalar.json',JSON.stringify(state,null,2),'application/json');toast('Natijalar eksport qilindi. JSON faylni saqlab qo‘ying.');}
document.getElementById('import-file').addEventListener('change',async event=>{
  const file=event.target.files[0];event.target.value='';if(!file)return;
  try{if(file.size>2*1024*1024)throw new Error('Fayl juda katta');const imported=normalize(JSON.parse(await file.text()));
    modal('Natijalarni import qilish',`${imported.history.length} ta urinish va ${imported.passed.filter(Boolean).length} ta mukammal bosqich topildi. Bu brauzerdagi joriy natijalar va tugallanmagan urinish ushbu fayldagi ma’lumot bilan almashtiriladi.`,()=>{state=imported;save();view='history';resultRecord=null;practice=null;render();checkExpiry();toast('Natijalar tiklandi.');},'Import qilish');
  }catch(e){toast('Fayl mos emas. Shu dasturdan eksport qilingan JSON faylni tanlang.');}
});
document.addEventListener('input',event=>{if(event.target.id==='student-name'){state.name=event.target.value.slice(0,50);save();}});
document.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
  if(action==='cancel-modal'){document.getElementById('modal').close();modalAction=null;return;}
  if(action==='confirm-modal'){const callback=modalAction;document.getElementById('modal').close();modalAction=null;callback?.();return;}
  if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render();return;}
  if(action==='go-home'){go('home');return;}if(action==='go-history'){go('history');return;}if(action==='go-rules'){go('rules');return;}
  if(action==='start'){requestStart(Number(el.dataset.stage));return;}if(action==='retry'){requestStart(Number(el.dataset.stage),true);return;}
  if(action==='answer'){chooseAnswer(Number(el.dataset.index));return;}if(action==='jump'){moveQuestion(Number(el.dataset.index));return;}
  if(action==='next'){moveQuestion(state.active.index+1);return;}if(action==='previous'){moveQuestion(state.active.index-1);return;}
  if(action==='flag'){if(checkExpiry()||!state.active)return;state.active.flags[state.active.index]=!state.active.flags[state.active.index];save();render();return;}
  if(action==='clear-answer'){if(checkExpiry()||!state.active)return;state.active.answers[state.active.index]=null;save();render();return;}
  if(action==='finish'){finishRequest();return;}
  if(action==='open-result'){const r=state.history.find(x=>x.id===el.dataset.id);if(r){resultRecord=r;resultFilter=r.correct===30?'all':'wrong';go('result');}return;}
  if(action==='filter-wrong'||action==='filter-all'){resultFilter=action==='filter-wrong'?'wrong':'all';render();return;}
  if(action==='download-result'){downloadResult();return;}if(action==='export'){exportState();return;}if(action==='import'){document.getElementById('import-file').click();return;}
  if(action==='practice'){startPractice();return;}if(action==='back-result'){go('result');return;}
  if(action==='practice-answer'){if(!practice||practice.checked)return;practice.choice=practice.order[Number(el.dataset.index)];render();return;}
  if(action==='practice-check'){practiceCheck();return;}if(action==='practice-next'){practiceNext();return;}
});
document.addEventListener('keydown',event=>{
  if(event.target.matches('input,textarea,select,[contenteditable="true"]')||event.ctrlKey||event.metaKey||event.altKey||document.getElementById('modal').open)return;
  if(event.target.closest('.brand')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();go('home');return;}
  if(view!=='exam'&&view!=='practice')return;
  const key=event.key.toLowerCase(),display=['a','b','c','d'].indexOf(key)>=0?['a','b','c','d'].indexOf(key):['1','2','3','4'].indexOf(key);
  if(display>=0){event.preventDefault();if(view==='exam')chooseAnswer(display);else if(practice&&!practice.checked){practice.choice=practice.order[display];render();}return;}
  if(view==='exam'&&state.active&&(key==='arrowleft'||key==='arrowright')){event.preventDefault();moveQuestion(state.active.index+(key==='arrowright'?1:-1));}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkExpiry();updateClock();}});
setInterval(()=>{if(!checkExpiry())updateClock();},1000);
render();checkExpiry();

</script>
